name: Manual Transcription Run

# 手动触发：在 GitHub 仓库 Actions 页面选择本工作流，点击 "Run workflow"，
# 只需填写视频链接。完成后直接把“转写文字版”通过 PushPlus 推送到微信，不跳转外部地址。
#
# 需在仓库 Settings → Secrets and variables → Actions 中配置：
#   TRANSCRIBER_BASE_URL  已部署的转写服务地址，如 https://your-host.example.com
#   PUSHPLUS_TOKEN        PushPlus 的 token
#
on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "视频/音频链接（YouTube 或普通 http(s) 直链）"
        required: true
        type: string
      output_format:
        description: "输出格式"
        required: false
        default: "txt"
        type: choice
        options:
          - txt
          - markdown
      language:
        description: "语言提示，如 zh / en / ja，留空自动检测"
        required: false
        default: ""
        type: string
      pushplus_topic:
        description: "PushPlus 群组编码 topic（可选，留空推送给自己）"
        required: false
        default: ""
        type: string
      push_title:
        description: "微信推送标题（可选，留空使用转写文本第一行）"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  run-and-push:
    name: Transcribe and push text to WeChat
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_URL: ${{ secrets.TRANSCRIBER_BASE_URL }}
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
      PUSHPLUS_TOPIC: ${{ inputs.pushplus_topic }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate configuration
        run: |
          if [ -z "$BASE_URL" ]; then
            echo "::error::未配置 secret TRANSCRIBER_BASE_URL，请在仓库 Settings → Secrets 中添加。"
            exit 1
          fi
          if [ -z "$PUSHPLUS_TOKEN" ]; then
            echo "::error::未配置 secret PUSHPLUS_TOKEN，请在仓库 Settings → Secrets 中添加。"
            exit 1
          fi
          echo "video_url    = ${{ inputs.video_url }}"
          echo "base_url     = (configured via secret)"
          echo "format       = ${{ inputs.output_format }}"
          echo "language     = ${{ inputs.language || '(auto)' }}"
          echo "pushplus     = configured"

      - name: Run transcription
        env:
          VIDEO_URL: ${{ inputs.video_url }}
          OUTPUT_FORMAT: ${{ inputs.output_format }}
          LANGUAGE: ${{ inputs.language }}
        run: |
          set -euo pipefail

          args=(
            "$VIDEO_URL"
            --base-url "$BASE_URL"
            --format "$OUTPUT_FORMAT"
            --result-json "result.json"
          )

          if [ -n "$LANGUAGE" ]; then
            args+=(--lang "$LANGUAGE")
          fi

          python manual_run.py "${args[@]}"

      - name: Push transcript text to WeChat via PushPlus
        env:
          PUSH_TITLE: ${{ inputs.push_title }}
        run: |
          set -euo pipefail

          args=(
            --result "result.json"
            --template txt
          )

          if [ -n "$PUSHPLUS_TOPIC" ]; then
            args+=(--topic "$PUSHPLUS_TOPIC")
          fi
          if [ -n "$PUSH_TITLE" ]; then
            args+=(--title "$PUSH_TITLE")
          fi

          # 只推送文字版内容，不带任何跳转链接或下载地址。
          python pushplus_push.py "${args[@]}"

      - name: Upload result JSON as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transcription-result
          path: result.json
          if-no-files-found: ignore
